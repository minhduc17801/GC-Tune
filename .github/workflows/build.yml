name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-wrapper.jar is not in the repo (*.jar is gitignored), so use a pinned Gradle.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 not set: debug APK uses the default debug key, release APK is unsigned."
          fi

      - name: Require keystore for release tags
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_FILE == ''
        run: |
          echo "::error::Tag build needs KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS secrets; refusing to publish an unsigned release."
          exit 1

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gctune-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            overlay_m3/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gctune-apk-${{ github.sha }}
          path: apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp apk/app/build/outputs/apk/release/app-release.apk "gctune-$TAG.apk"
          cp apk/overlay_m3/build/outputs/apk/release/overlay_m3-release.apk "gctune-overlay-m3-$TAG.apk"
          gh release create "$TAG" "gctune-$TAG.apk" "gctune-overlay-m3-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
